# SonarQube Cloud Automatic Analysis reads THIS file from the repository root — it does not read
# sonar-project.properties, which is the scanner's file for a CI-based scan:
#   "Automatic Analysis reads .sonarcloud.properties for additional configuration, including
#    sonar.exclusions. It does not read the settings in sonar-project.properties."
#   https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis.md
# That is why the exclusions in sonar-project.properties had no effect: analyses of 2026-11-15 kept
# reporting .specify/scripts/powershell/common.ps1 while that path was listed there. Keep the two
# files in sync in case the project ever moves to a CI-based scan.
#
# Only product code is in scope, declared positively with sonar.sources: the libraries, tests,
# examples and benchmarks, plus .github so the workflow files keep their supply-chain checks.
#
# The Spec Kit tooling (.specify scripts and templates, the agent command files in .clinerules), the
# specs it produces and docs/ stay out of the analysis: they are vendored or generated, and
# analysing them once produced 325 of 327 issues, all six vulnerabilities and 99 % copy-paste blocks
# from duplicated runtime scripts.
#
# .github stays in scope on purpose: githubactions:S7637 (an unpinned third-party action is a
# security vulnerability) is what keeps every non-GitHub action pinned to a full commit SHA — it was
# the project's only vulnerability and held the security rating at C until NuGet/login was pinned.
sonar.sources=src,tests,examples,benchmarks,.github
sonar.exclusions=**/bin/**,**/obj/**,artifacts/**
