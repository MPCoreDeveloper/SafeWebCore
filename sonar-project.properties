# SonarQube Cloud analyses this repository with Automatic Analysis (GitHub App, no CI-based
# scan: https://sonarcloud.io/dashboard?id=MPCoreDeveloper_SafeWebCore). Automatic Analysis
# reads this file from the repository root and honours the documented subset of properties,
# which includes sonar.sources, sonar.inclusions, sonar.exclusions, sonar.tests,
# sonar.test.exclusions, sonar.test.inclusions, sonar.sourceEncoding and sonar.cpd.exclusions.
#
# Only product code belongs in the analysis scope. The Spec Kit tooling (.specify scripts and
# templates, the agent commands generated into .clinerules) is not project code, and neither are
# the artifacts it produces (specs) or the documentation it renders. Analysing the tooling as
# sources once produced 325 of 327 issues, all six vulnerabilities and 99 % copy-paste blocks from
# the duplicated runtime scripts, which failed the quality gate (58.5 % duplicated lines and a D
# security rating on new code). Excluding them keeps the gate about SafeWebCore itself.
sonar.exclusions=.specify/**,.clinerules/**,specs/**,docs/**,artifacts/**,**/bin/**,**/obj/**
