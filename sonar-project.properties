# SonarQube Cloud analyses this repository with Automatic Analysis (GitHub App, no CI-based
# scan: https://sonarcloud.io/dashboard?id=MPCoreDeveloper_SafeWebCore). Automatic Analysis reads
# this file from the repository root and honours the documented subset of properties, which
# includes sonar.sources, sonar.inclusions, sonar.exclusions, sonar.tests, sonar.test.exclusions,
# sonar.test.inclusions, sonar.sourceEncoding and sonar.cpd.exclusions.
#
# Only product code is in scope, and it is declared positively with sonar.sources: the libraries,
# tests, examples and benchmarks, plus .github so the workflow files keep their supply-chain
# checks. A negative scope did not work: on 2026-11-15 an analysis created seven findings on
# .specify/scripts/powershell/common.ps1 while that path was already listed in sonar.exclusions, so
# the exclusion pattern was not applied to it. Listing the product paths is the reliable form.
#
# The Spec Kit tooling (.specify scripts and templates, the agent command files in .clinerules), the
# specs it produces and docs/ stay out of the analysis: they are vendored or generated, and
# analysing them once produced 325 of 327 issues, all six vulnerabilities and 99 % copy-paste blocks
# from the duplicated runtime scripts, which failed the gate on 58.5 % duplicated lines.
#
# .github stays in scope on purpose: githubactions:S7637 (an unpinned third-party action is a
# security vulnerability) is what keeps every non-GitHub action pinned to a full commit SHA.
sonar.sources=src,tests,examples,benchmarks,.github
sonar.exclusions=**/bin/**,**/obj/**,artifacts/**
